<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0EA5E9" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Sea background -->
  <rect width="300" height="600" fill="url(#bg)" rx="16"/>

  <!-- Grid lines (sea texture) -->
  <g stroke="#BAE6FD" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="300" y2="100"/>
    <line x1="0" y1="200" x2="300" y2="200"/>
    <line x1="0" y1="300" x2="300" y2="300"/>
    <line x1="0" y1="400" x2="300" y2="400"/>
    <line x1="0" y1="500" x2="300" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
  </g>

  <!--
    Vietnam mainland — S-shaped country.
    North (wide): top ~x=80..200, y=20
    Central (narrow): x=100..170, y=200-350
    South (spreads west): x=60..180, y=450-540
  -->
  <path
    filter="url(#shadow)"
    fill="url(#land)"
    stroke="#0EA5E9"
    stroke-width="1.5"
    stroke-linejoin="round"
    d="
      M 140,22
      C 160,20 182,24 196,34
      C 210,44 214,60 208,74
      C 218,80 228,90 226,106
      C 224,120 212,130 202,140
      C 212,150 220,164 216,180
      C 212,196 198,204 186,214
      C 192,226 196,242 190,258
      C 184,274 170,280 158,290
      C 162,304 164,320 156,334
      C 148,348 134,352 122,362
      C 126,376 126,394 116,408
      C 106,422 90,426 76,434
      C 80,448 76,466 62,476
      C 50,484 34,484 22,478
      C 14,470 12,458 18,448
      C 24,438 36,434 46,426
      C 38,416 32,402 38,390
      C 44,378 58,374 68,366
      C 60,354 56,338 62,324
      C 68,310 82,304 92,296
      C 84,282 80,266 88,252
      C 96,238 112,234 124,226
      C 116,212 112,196 120,182
      C 128,168 144,164 156,156
      C 148,142 144,126 152,112
      C 160,98 176,94 186,84
      C 178,70 172,54 178,40
      C 182,30 192,24 202,22
      C 188,20 164,20 140,22 Z
    "
  />

  <!-- Phu Quoc island (bottom left) -->
  <ellipse cx="48" cy="530" rx="12" ry="20"
    fill="#7DD3FC" fill-opacity="0.5"
    stroke="#0EA5E9" stroke-width="1.2"/>

  <!-- Con Dao island -->
  <ellipse cx="140" cy="502" rx="7" ry="11"
    fill="#7DD3FC" fill-opacity="0.45"
    stroke="#0EA5E9" stroke-width="1"/>

  <!-- Hoang Sa (top right sea) -->
  <circle cx="248" cy="220" r="10"
    fill="#BAE6FD" fill-opacity="0.6"
    stroke="#38BDF8" stroke-width="1"/>
  <circle cx="262" cy="234" r="6"
    fill="#BAE6FD" fill-opacity="0.5"
    stroke="#38BDF8" stroke-width="0.8"/>

  <!-- Truong Sa (bottom right sea) -->
  <circle cx="256" cy="400" r="8"
    fill="#BAE6FD" fill-opacity="0.6"
    stroke="#38BDF8" stroke-width="1"/>
  <circle cx="268" cy="414" r="5"
    fill="#BAE6FD" fill-opacity="0.5"
    stroke="#38BDF8" stroke-width="0.8"/>

  <!-- City dots -->
  <!-- Ha Noi -->
  <circle cx="164" cy="108" r="5" fill="#0EA5E9"/>
  <circle cx="164" cy="108" r="3" fill="white"/>

  <!-- Da Nang -->
  <circle cx="168" cy="258" r="4" fill="#0EA5E9"/>
  <circle cx="168" cy="258" r="2.5" fill="white"/>

  <!-- TP HCM -->
  <circle cx="96" cy="420" r="5" fill="#0EA5E9"/>
  <circle cx="96" cy="420" r="3" fill="white"/>
</svg>
